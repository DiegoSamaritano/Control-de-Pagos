<section class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon income">
      <i class="ph-bold ph-arrow-down-left"></i>
    </div>
    <div class="stat-details">
      <span class="stat-label">Total Depositado</span>
      <h3 id="totalDepositado" class="stat-value text-emerald">S/ 0.00</h3>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon expense">
      <i class="ph-bold ph-arrow-up-right"></i>
    </div>
    <div class="stat-details">
      <span class="stat-label">Total Pagado</span>
      <h3 id="totalPagado" class="stat-value text-rose">S/ 0.00</h3>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon balance">
      <i class="ph-bold ph-scales"></i>
    </div>
    <div class="stat-details">
      <span class="stat-label">Saldo Disponible</span>
      <h3 id="saldoDisponible" class="stat-value text-blue">S/ 0.00</h3>
    </div>
  </div>
</section>
